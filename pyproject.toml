[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "erdos-minimum-overlap-lower-bound"
version = "0.1.1"
description = "Reproducible certificate tooling for the Erdos minimum-overlap lower bound"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
authors = [
  { name = "Ruturaj R Raval" },
]
dependencies = [
  "numpy==2.4.6",
  "python-flint==0.9.0",
]

[project.scripts]
minoverlap = "minoverlap.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]
research = [
  "cvxpy==1.9.2",
  "mpmath==1.3.0",
  "scipy==1.16.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/minoverlap"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["generated", "upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["minoverlap"]
