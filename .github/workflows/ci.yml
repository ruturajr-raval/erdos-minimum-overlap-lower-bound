name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgmp-dev libmpfi-dev libmpfr-dev
      - run: uv sync --all-groups --locked
      - run: make test
      - run: make lint
      - run: make typecheck
      - run: make build
      - run: make audit

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update
      - run: sudo apt-get install -y latexmk texlive-latex-extra
      - run: make paper-build
      - run: make paper-bundle
      - run: tar -tzf dist/arxiv/erdos-minimum-overlap-038055925.tar.gz
