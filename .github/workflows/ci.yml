name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          python-version: "3.12"
          enable-cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install -y libgmp-dev libmpfi-dev libmpfr-dev
      - run: uv sync --all-groups --locked
      - run: make test
      - run: make lint
      - run: make typecheck
      - run: make build
      - run: make audit

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update
      - run: sudo apt-get install -y latexmk texlive-latex-extra
      - run: make paper-bundle
      - run: make paper-release
      - run: make verify-release-assets
      - run: tar -tzf dist/arxiv/erdos-minimum-overlap-038055925.tar.gz
      - name: Rebuild PDF from release source archive
        run: |
          mkdir -p build/release-source-replay
          tar -xzf \
            dist/release/v0.3.1/erdos-minimum-overlap-lower-bound-v0.3.1-paper-source.tar.gz \
            -C build/release-source-replay
          cd build/release-source-replay
          SOURCE_DATE_EPOCH=1788739200 \
            latexmk -pdf -interaction=nonstopmode -halt-on-error \
              -file-line-error main.tex
          cmp main.pdf \
            ../../dist/release/v0.3.1/erdos-minimum-overlap-lower-bound-v0.3.1-paper.pdf
      - name: Assert committed paper assets are current
        run: |
          git diff --exit-code -- \
            dist/arxiv/erdos-minimum-overlap-038055925.tar.gz \
            dist/release/v0.3.1
